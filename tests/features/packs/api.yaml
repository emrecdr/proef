# API pack for the 500-series suite: every step binds business prose to hurl
# entries against the fixture backend.
templates:
  provisionEnvironment:
    match: the client environment is provisioned
    description: Create a fresh backend environment for one scenario run.
    tags: [Setup]
    steps:
      - name: fixture warm-up probe
        optional: true
        hurl: |
          GET ${baseURL}/health
          HTTP 200
      - name: provision the environment
        hurl: |
          POST ${baseURL}/api/v1/env/provision
          Authorization: Bearer ${secret:apiToken}
          {"run": "${run:id}"}
          HTTP 201
          [Captures]
          envId: jsonpath "$.id"
  activateFeed:
    match: the client feed is activated and ready
    description: Activate the provisioned client feed and poll until it reports ready.
    tags: [Setup]
    steps:
      - name: request activation
        hurl: |
          POST ${baseURL}/api/v1/feed/activate
          X-Proef-Env: {{envId}}
          Authorization: Bearer ${secret:apiToken}
          {"env": "{{envId}}"}
          HTTP 200
          [Captures]
          feedId: jsonpath "$.feedId"
      - name: feed reports ready
        retry: { count: 10, interval_ms: 300 }
        hurl: |
          GET ${baseURL}/api/v1/feed/{{feedId}}/state
          X-Proef-Env: {{envId}}
          HTTP 200
          [Asserts]
          jsonpath "$.status" == "ready"
  searchClients:
    params: [q, index]
    defaults: { index: clients }
    description: Admin search over an index; captures the first hit's id.
    tags: [Admin]
    steps:
      - name: search ${index} for ${q}
        hurl: |
          GET ${baseURL}/api/v1/admin/search/${index}
          Authorization: Bearer ${secret:apiToken}
          [Query]
          q: ${q}
          HTTP 200
          [Captures]
          clientId: jsonpath "$[0].id"
  resolveClient:
    params: [name]
    match: "the client {name} is resolved"
    description: Resolve a client by (run-scoped) surname; remembers the id globally.
    tags: [Admin]
    steps:
      - use: searchClients
        with: { q: "${name}" }
      - name: confirm the client exists
        saveAs: { clientId: global }
        hurl: |
          GET ${baseURL}/api/v1/clients/{{clientId}}
          Authorization: Bearer ${secret:apiToken}
          HTTP 200
          [Asserts]
          jsonpath "$.id" == "{{clientId}}"
  adminSearch:
    params: [term, index]
    defaults: { index: clients }
    match: "the admin searches for {term}"
    description: Search step for the matrix suite (index via data table). No
      response block — the Then-step's expectStatus merge supplies `HTTP *`
      plus the status assert.
    tags: [Admin]
    steps:
      - name: search ${index} for ${term}
        hurl: |
          GET ${baseURL}/api/v1/admin/search/${index}
          Authorization: Bearer ${secret:apiToken}
          [Query]
          q: ${term}
  sendMessage:
    match: the relative sends a message to the client
    description: Post a message to the resolved client as the relative.
    tags: [Messaging]
    steps:
      - name: send the message
        hurl: |
          POST ${baseURL}/api/v1/clients/{{clientId}}/messages
          X-Proef-Env: {{envId}}
          Authorization: Bearer ${secret:apiToken}
          {"body": "Hallo from proef ${run:id}"}
          HTTP 201
          [Captures]
          messageId: jsonpath "$.id"
  pushDispatched:
    match: the backend dispatches a push notification
    description: Poll the push queue until the latest item becomes visible.
    tags: [Messaging]
    steps:
      - name: push visible in queue
        retry: { count: 10, interval_ms: 300 }
        hurl: |
          GET ${baseURL}/api/v1/push/queue
          X-Proef-Env: {{envId}}
          Authorization: Bearer ${secret:apiToken}
          HTTP 200
          [Asserts]
          jsonpath "$.items" count > 0
  feedShowsMessage:
    match: the client feed shows the message from the relative
    description: The client's synced message feed contains the sent message.
    tags: [Messaging]
    steps:
      - name: message visible in the feed
        retry: { count: 10, interval_ms: 300 }
        hurl: |
          GET ${baseURL}/api/v1/feed/{{feedId}}/messages
          X-Proef-Env: {{envId}}
          HTTP 200
          [Asserts]
          jsonpath "$.messages[0].id" == "{{messageId}}"
  scheduleAppointment:
    match: the relative schedules an appointment
    description: Create an agenda event for the resolved client.
    tags: [Calendar]
    steps:
      - name: create the agenda event
        hurl: |
          POST ${baseURL}/api/v1/clients/{{clientId}}/agenda/events
          X-Proef-Env: {{envId}}
          Authorization: Bearer ${secret:apiToken}
          {"title": "Koffie", "run": "${run:id}"}
          HTTP 201
          [Captures]
          eventId: jsonpath "$.id"
  feedShowsAppointment:
    match: the client calendar feed shows the appointment
    description: The client's calendar feed contains the created event.
    tags: [Calendar]
    steps:
      - name: appointment visible in the feed
        retry: { count: 10, interval_ms: 300 }
        hurl: |
          GET ${baseURL}/api/v1/feed/{{feedId}}/calendar
          X-Proef-Env: {{envId}}
          HTTP 200
          [Asserts]
          jsonpath "$.events[0].id" == "{{eventId}}"
  uploadPhoto:
    match: the relative uploads a photo
    description: Register a photo for the client (JSON body at M1; multipart lands M5).
    tags: [Photos]
    steps:
      - name: upload the photo
        hurl: |
          POST ${baseURL}/api/v1/clients/{{clientId}}/photos
          X-Proef-Env: {{envId}}
          Authorization: Bearer ${secret:apiToken}
          {"source": "${env:RUNTIME_PHOTO:-fixture.jpg}", "run": "${run:id}"}
          HTTP 201
          [Captures]
          photoId: jsonpath "$.id"
  feedShowsPhoto:
    match: the client photo feed shows the photo
    description: The client's photo feed contains the uploaded photo.
    tags: [Photos]
    steps:
      - name: photo visible in the feed
        retry: { count: 10, interval_ms: 300 }
        hurl: |
          GET ${baseURL}/api/v1/feed/{{feedId}}/photos
          X-Proef-Env: {{envId}}
          HTTP 200
          [Asserts]
          jsonpath "$.photos[0].id" == "{{photoId}}"
  placeCall:
    match: the relative places a video call
    description: Start a video call for the resolved client.
    tags: [Calls]
    steps:
      - name: place the call
        hurl: |
          POST ${baseURL}/api/v1/clients/{{clientId}}/calls
          X-Proef-Env: {{envId}}
          Authorization: Bearer ${secret:apiToken}
          {"kind": "video", "run": "${run:id}"}
          HTTP 201
          [Captures]
          callId: jsonpath "$.id"
  feedShowsIncomingCall:
    match: the call feed shows the incoming call
    description: The client's call feed reports the incoming state.
    tags: [Calls]
    steps:
      - name: incoming call visible
        retry: { count: 10, interval_ms: 300 }
        hurl: |
          GET ${baseURL}/api/v1/feed/{{feedId}}/call
          X-Proef-Env: {{envId}}
          HTTP 200
          [Asserts]
          jsonpath "$.state" == "incoming"
          jsonpath "$.callId" == "{{callId}}"
  denyCall:
    match: the call can be denied via the API
    description: Deny the incoming call and verify the feed returns to idle.
    tags: [Calls]
    steps:
      - name: deny the call
        hurl: |
          POST ${baseURL}/api/v1/feed/{{feedId}}/call/{{callId}}/deny
          X-Proef-Env: {{envId}}
          HTTP 200
      - name: call state back to idle
        hurl: |
          GET ${baseURL}/api/v1/feed/{{feedId}}/call
          X-Proef-Env: {{envId}}
          HTTP 200
          [Asserts]
          jsonpath "$.state" == "idle"
