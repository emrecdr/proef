# API pack for the 500-series suite: every step binds business prose to hurl
# entries against the fixture backend. The domain is a generic workspace /
# activity board — a member posts items to a record, they surface on the
# record's synced activity channel.
macros:
  provisionEnvironment:
    match: the workspace is provisioned
    description: Create a fresh backend environment for one scenario run.
    tags: [Setup]
    steps:
      - name: fixture warm-up probe
        optional: true
        hurl: |
          GET ${baseURL}/health
          HTTP 200
      - name: provision the environment
        hurl: |
          POST ${baseURL}/api/v1/env/provision
          Authorization: Bearer ${secret:apiToken}
          {"run": "${run:id}"}
          HTTP 201
          [Captures]
          envId: jsonpath "$.id"
  activateChannel:
    match: the activity channel is activated and ready
    description: Activate the record's activity channel and poll until it reports ready.
    tags: [Setup]
    steps:
      - name: request activation
        hurl: |
          POST ${baseURL}/api/v1/channel/activate
          X-Proef-Env: {{envId}}
          Authorization: Bearer ${secret:apiToken}
          {"env": "{{envId}}"}
          HTTP 200
          [Captures]
          channelId: jsonpath "$.channelId"
      - name: channel reports ready
        retry: { count: 10, interval_ms: 300 }
        hurl: |
          GET ${baseURL}/api/v1/channel/{{channelId}}/state
          X-Proef-Env: {{envId}}
          HTTP 200
          [Asserts]
          jsonpath "$.status" == "ready"
  searchRecords:
    params: [q, index]
    defaults: { index: records }
    description: Admin search over an index; captures the first hit's id.
    tags: [Admin]
    steps:
      - name: search ${index} for ${q}
        hurl: |
          GET ${baseURL}/api/v1/admin/search/${index}
          Authorization: Bearer ${secret:apiToken}
          [Query]
          q: ${q}
          HTTP 200
          [Captures]
          recordId: jsonpath "$[0].id"
  resolveRecord:
    params: [name]
    match: "the record {name} is resolved"
    description: Resolve a record by (run-scoped) name; remembers the id globally.
    tags: [Admin]
    steps:
      - use: searchRecords
        with: { q: "${name}" }
      - name: confirm the record exists
        saveAs: { recordId: global }
        hurl: |
          GET ${baseURL}/api/v1/records/{{recordId}}
          Authorization: Bearer ${secret:apiToken}
          HTTP 200
          [Asserts]
          jsonpath "$.id" == "{{recordId}}"
  adminSearch:
    params: [term, index]
    defaults: { index: records }
    match: "the operator searches for {term}"
    description: Search step for the matrix suite (index via data table). No
      response block — the Then-step's expectStatus merge supplies `HTTP *`
      plus the status assert.
    tags: [Admin]
    steps:
      - name: search ${index} for ${term}
        hurl: |
          GET ${baseURL}/api/v1/admin/search/${index}
          Authorization: Bearer ${secret:apiToken}
          [Query]
          q: ${term}
  postNote:
    match: a member posts a note to the board
    description: Post a note to the resolved record.
    tags: [Notes]
    steps:
      - name: post the note
        hurl: |
          POST ${baseURL}/api/v1/records/{{recordId}}/notes
          X-Proef-Env: {{envId}}
          Authorization: Bearer ${secret:apiToken}
          {"body": "Note from proef ${run:id}"}
          HTTP 201
          [Captures]
          noteId: jsonpath "$.id"
  deliveryRecorded:
    match: the service records a delivery
    description: Poll the delivery queue until the latest item becomes visible.
    tags: [Notes]
    steps:
      - name: delivery visible in queue
        retry: { count: 10, interval_ms: 300 }
        hurl: |
          GET ${baseURL}/api/v1/deliveries/queue
          X-Proef-Env: {{envId}}
          Authorization: Bearer ${secret:apiToken}
          HTTP 200
          [Asserts]
          jsonpath "$.items" count > 0
  boardShowsNote:
    match: the board shows the note
    description: The record's synced note channel contains the posted note.
    tags: [Notes]
    steps:
      - name: note visible on the board
        retry: { count: 10, interval_ms: 300 }
        hurl: |
          GET ${baseURL}/api/v1/channel/{{channelId}}/notes
          X-Proef-Env: {{envId}}
          HTTP 200
          [Asserts]
          jsonpath "$.notes[0].id" == "{{noteId}}"
  scheduleItem:
    match: a member adds a scheduled item
    description: Create a scheduled event on the resolved record.
    tags: [Events]
    steps:
      - name: create the event
        hurl: |
          POST ${baseURL}/api/v1/records/{{recordId}}/events
          X-Proef-Env: {{envId}}
          Authorization: Bearer ${secret:apiToken}
          {"title": "Review", "run": "${run:id}"}
          HTTP 201
          [Captures]
          eventId: jsonpath "$.id"
  boardShowsItem:
    match: the board shows the scheduled item
    description: The record's event channel contains the created event.
    tags: [Events]
    steps:
      - name: item visible on the board
        retry: { count: 10, interval_ms: 300 }
        hurl: |
          GET ${baseURL}/api/v1/channel/{{channelId}}/events
          X-Proef-Env: {{envId}}
          HTTP 200
          [Asserts]
          jsonpath "$.events[0].id" == "{{eventId}}"
  uploadAttachment:
    match: a member uploads an attachment
    description: Register an attachment for the record (JSON body at M1; multipart lands M5).
    tags: [Attachments]
    steps:
      - name: upload the attachment
        hurl: |
          POST ${baseURL}/api/v1/records/{{recordId}}/attachments
          X-Proef-Env: {{envId}}
          Authorization: Bearer ${secret:apiToken}
          {"source": "${env:RUNTIME_ATTACHMENT:-fixture.jpg}", "run": "${run:id}"}
          HTTP 201
          [Captures]
          attachmentId: jsonpath "$.id"
  boardShowsAttachment:
    match: the board shows the attachment
    description: The record's attachment channel contains the uploaded attachment.
    tags: [Attachments]
    steps:
      - name: attachment visible on the board
        retry: { count: 10, interval_ms: 300 }
        hurl: |
          GET ${baseURL}/api/v1/channel/{{channelId}}/attachments
          X-Proef-Env: {{envId}}
          HTTP 200
          [Asserts]
          jsonpath "$.attachments[0].id" == "{{attachmentId}}"
  startSession:
    match: a member starts a live session
    description: Start a live session on the resolved record.
    tags: [Sessions]
    steps:
      - name: start the session
        hurl: |
          POST ${baseURL}/api/v1/records/{{recordId}}/sessions
          X-Proef-Env: {{envId}}
          Authorization: Bearer ${secret:apiToken}
          {"kind": "live", "run": "${run:id}"}
          HTTP 201
          [Captures]
          sessionId: jsonpath "$.id"
  boardShowsPendingSession:
    match: the board shows the pending session
    description: The record's session channel reports the pending state.
    tags: [Sessions]
    steps:
      - name: pending session visible
        retry: { count: 10, interval_ms: 300 }
        hurl: |
          GET ${baseURL}/api/v1/channel/{{channelId}}/session
          X-Proef-Env: {{envId}}
          HTTP 200
          [Asserts]
          jsonpath "$.state" == "pending"
          jsonpath "$.sessionId" == "{{sessionId}}"
  cancelSession:
    match: the session can be cancelled via the API
    description: Cancel the pending session and verify the channel returns to idle.
    tags: [Sessions]
    steps:
      - name: cancel the session
        hurl: |
          POST ${baseURL}/api/v1/channel/{{channelId}}/session/{{sessionId}}/cancel
          X-Proef-Env: {{envId}}
          HTTP 200
      - name: session state back to idle
        hurl: |
          GET ${baseURL}/api/v1/channel/{{channelId}}/session
          X-Proef-Env: {{envId}}
          HTTP 200
          [Asserts]
          jsonpath "$.state" == "idle"
