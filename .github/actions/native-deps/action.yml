# The one home for the Linux native-dependency list (the hurl engine links
# libcurl/libxml2/openssl). Used by ci.yml (gates + canary), nightly.yml,
# and release.yml — add packages here, nowhere else.
name: native-deps
description: Native build prerequisites for the embedded hurl engine (Linux)
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config libssl-dev \
          libcurl4-openssl-dev libxml2-dev libclang-dev
