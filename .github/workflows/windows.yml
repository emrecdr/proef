# Windows gates (TESTING-STRATEGY §3): per-PR since the port went green
# (2026-07-28). Recipe mirrors hurl's own Windows CI: vcpkg-built curl +
# libxml2, dynamic linkage, bindgen pointed at the vcpkg include dir. LF is
# forced *before* checkout — the snapshot corpus is byte-exact and CRLF would
# break it.
name: windows

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

# Supersede in-flight runs on a new push to the same ref, so an outdated commit
# never leaves a stale red on the PR (each ref keeps its own group).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates-windows:
    name: build + tests (windows)
    runs-on: windows-latest
    steps:
      - name: Force LF line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master # zizmor: ignore[ref-version-mismatch] — no version tags; pinned to a reviewed master commit
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install gate tools
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: cargo-nextest

      - name: Install native build prerequisites (vcpkg + hurl icon + env)
        uses: ./.github/actions/setup-hurl-windows
        with:
          build-roots: target\debug\build

      - name: Build and test
        shell: pwsh
        run: |
          cargo build --workspace --all-targets
          if ($LASTEXITCODE) { Throw }
          cargo nextest run --profile ci
          if ($LASTEXITCODE) { Throw }
