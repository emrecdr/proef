# CI gates (TECH-SPEC §15) — every milestone lands green on all of these.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs on a new push to the same ref, so an outdated commit
# never leaves a stale red on the PR (each ref keeps its own group).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 25
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native build prerequisites (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/native-deps

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master # zizmor: ignore[ref-version-mismatch] — no version tags; pinned to a reviewed master commit
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install gate tools
        uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          # zizmor is pinned: it gates the build, and an unpinned analyser
          # turns "latest publishes a new audit" into a red gate on an
          # unchanged tree. Bump deliberately, like any other gate input.
          tool: cargo-nextest,cargo-deny,cargo-machete,zizmor@1.29.0

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: tests (nextest)
        run: cargo nextest run --profile ci --locked

      - name: doctests
        run: cargo test --doc --locked

      # Alone, deliberately. A timing ratio cannot share a machine with the
      # rest of the suite: measured at 2.05x isolated and 3.09x under nextest's
      # full parallelism, because the larger input's working set suffers more
      # from memory contention — so the ratio drifts rather than cancelling.
      # `#[ignore]` keeps it out of the suite; this step is where it runs.
      - name: complexity guards (timing — runs alone)
        run: cargo nextest run --profile ci --locked --run-ignored only -E 'test(validation_cost_stays_linear)'

      - name: rustdoc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features --workspace

      - name: cargo deny
        run: cargo deny check

      # cargo audit runs nightly instead: deny covers PRs, and the case bare
      # deny misses — a fresh advisory against unchanged code — needs a schedule.
      - name: unused dependencies (machete)
        run: cargo machete

      # fuzz/ is excluded from the root workspace, so none of the gates above
      # compile it — a changed proef-core signature breaks the fuzz targets
      # while every root-workspace gate stays green. fuzz-smoke does catch it,
      # but only on floating nightly with sanitizers and a minute later; this
      # proves they build on the pinned stable toolchain, on both gate
      # platforms. (The fuzz loop below now runs fuzz_tag_expr too.)
      # --locked because fuzz/Cargo.lock is committed: a fresh upstream
      # release must not redden this gate on an unchanged tree.
      - name: fuzz targets compile
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets --locked

      - name: workflow static analysis (zizmor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor .github/workflows/

      - name: docs alignment (xtask docs-check)
        run: cargo run -p xtask --locked -- docs-check

      - name: doctor smoke
        run: cargo run -p proef --locked -- doctor

  # PR fuzz smoke (TESTING-STRATEGY): 30 s per target; the full run is nightly.
  fuzz-smoke:
    name: fuzz smoke (30s/target)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master # zizmor: ignore[ref-version-mismatch] — no version tags; pinned to a reviewed master commit
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz + cargo-public-api
        uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: cargo-fuzz,cargo-public-api

      - name: Fuzz smoke
        # Explicit host triple: the prebuilt cargo-fuzz defaults to its own
        # musl build target, and sanitizers reject statically linked libc.
        #
        # Targets come from `cargo fuzz list`, not a list written here. The
        # names were spelled out in this file *and* in nightly.yml, so a new
        # target ran nowhere until both were edited — and nothing failed to say
        # so, which is the same "looks covered, is not" failure the fragment
        # targets exist to fix.
        run: |
          host=$(rustc +nightly -vV | sed -n 's/^host: //p')
          targets=$(cargo +nightly fuzz list)
          test -n "$targets" || { echo "no fuzz targets discovered"; exit 1; }
          for target in $targets; do
            echo "::group::$target"
            cargo +nightly fuzz run "$target" --target "$host" -- -max_total_time=30
            echo "::endgroup::"
          done

      # The mechanical form of "adding an engine leaves core diff-empty":
      # proef-core's public API surface is snapshot-locked (nightly rustdoc).
      - name: public API surface (proef-core)
        run: cargo run -p xtask --locked -- public-api

  # The real upgrade canary (ADR-0003, M4): fast no-op while the pin is the
  # latest hurl release. Runs on main pushes and nightly — not on PRs, so an
  # upstream release cannot turn unrelated PRs red (pins still never move here).
  canary:
    name: canary (next hurl release)
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native build prerequisites
        uses: ./.github/actions/native-deps

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master # zizmor: ignore[ref-version-mismatch] — no version tags; pinned to a reviewed master commit
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install gate tools
        uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: cargo-nextest

      - name: Canary — build + test against the next hurl release
        run: cargo run -p xtask -- canary
