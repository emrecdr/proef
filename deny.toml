# cargo-deny configuration (CI gate — TECH-SPEC §15)

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# No advisory ignores. The quick-xml pair (RUSTSEC-2026-0194/0195) sat here
# with "drop when quick-junit bumps its quick-xml requirement" — the bump
# happened (quick-junit 0.7 → quick-xml 0.41, the patched line) and the
# ignores stayed, where they would also have silenced any NEW advisory filed
# against 0.41.x. An ignore must name its expiry AND be checked at every dep
# bump that could satisfy it.
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "curl",
    "OpenSSL",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Intra-workspace path deps carry no version (publish = false) — not real wildcards.
allow-wildcard-paths = true
# Banned crates (CLAUDE.md hard constraints)
deny = [
    { crate = "serde_yaml", reason = "archived — use serde_norway (ADR-0004)" },
    { crate = "serde_yml", reason = "bad fork — use serde_norway (ADR-0004)" },
    { crate = "reqwest", reason = "superseded by the embedded hurl engine (ADR-0001)" },
    { crate = "async-trait", reason = "sync dyn traits only in v1 (ADR-0006)" },
    { crate = "maybe-async", reason = "non-additive feature hazard (ADR-0006)" },
    # No async runtime (ADR-0006/0007): the tokio *crate* is a non-optional dep of
    # tokio-util (sync primitives only, default-features = false) — that one edge is
    # sanctioned; any other crate introducing tokio trips this ban.
    { crate = "tokio", reason = "no async runtime — tokio-util CancellationToken only (ADR-0006/0007)", wrappers = ["tokio-util"] },
    # NOT here: the bundled-libcurl floor (curl-sys >= 0.4.90). A version-spec
    # ban mismatches curl-sys's build-metadata versions in cargo-deny 0.19.8 —
    # measured: `curl-sys@<0.4.90` banned `0.4.90+curl-8.21.0` (the good
    # version) and `<0.4.91` banned nothing. The floor lives as a unit test in
    # proef-engine-hurl (`bundled_curl_stays_at_or_past_the_cve_floor`).
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
